<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c46ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff6ec7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4dd0ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGradient)"/>
  
  <!-- Letter A -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="380" font-weight="bold" fill="white" text-anchor="middle">A</text>
  
  <!-- Small accent -->
  <circle cx="410" cy="140" r="30" fill="white" opacity="0.8"/>
</svg>
